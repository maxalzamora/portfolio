    <script>
        (function () {
            try {
                var root = document.documentElement;
                var defaults = {
                    palette: root.getAttribute('data-palette') || 'paper',
                    fonts: root.getAttribute('data-fonts') || 'editorial',
                    texture: root.getAttribute('data-texture') || 'soft',
                    accent: root.getAttribute('data-accent') || ''
                };
                window.__PORTFOLIO_DEFAULTS__ = defaults;

                var saved = localStorage.getItem('portfolio-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved === 'dark' || (!saved && prefersDark) ? 'dark' : 'light';

                root.setAttribute('data-theme', theme);
                root.style.colorScheme = theme;

                var palette = localStorage.getItem('portfolio-palette');
                var fonts = localStorage.getItem('portfolio-fonts');
                var texture = localStorage.getItem('portfolio-texture');
                var accent = localStorage.getItem('portfolio-accent');

                if (palette) root.setAttribute('data-palette', palette);
                if (fonts) root.setAttribute('data-fonts', fonts);
                if (texture) root.setAttribute('data-texture', texture);

                if (accent === 'palette') {
                    root.style.removeProperty('--accent');
                } else if (accent) {
                    root.style.setProperty('--accent', accent);
                } else if (defaults.accent) {
                    root.style.setProperty('--accent', defaults.accent);
                }
            } catch (error) {
                /* Theme preference is optional. */
            }
        })();
    </script>
